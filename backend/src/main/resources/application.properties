spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/library_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#localhost:3306: 내 Mac에서 실행 중인 MySQL
#library_db: 우리가 만든 데이터베이스
#username=root: MySQL 사용자
#${DB_PASSWORD}: 코드에 비밀번호를 직접 적지 않고 환경변수 사용
#ddl-auto=validate: Java Entity와 DB 테이블 구조가 같은지 검사
#show-sql=true: 실행된 SQL을 콘솔에 표시